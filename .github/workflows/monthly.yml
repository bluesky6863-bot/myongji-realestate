name: Monthly RealEstate Report

on:
  schedule:
    # 매월 1일 한국 시간 저녁 7시 (UTC 10:00)
    - cron: '0 10 1 * *'
  workflow_dispatch: # 필요 시 깃허브에서 수동 테스트 실행 가능한 버튼

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-generativeai requests

      - name: Run script
        run: python main.py
